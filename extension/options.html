<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片识别翻译设置</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <header class="top">
    <h1>图片识别翻译设置</h1>
  </header>
  <form id="settings-form" class="surface form">
    <label for="mode">处理方式</label>
    <select id="mode">
      <option value="translate">识别并翻译</option>
      <option value="ocr">仅识别</option>
    </select>
    <div id="target-fields" class="form" hidden>
      <label for="target">目标语言</label>
      <input id="target" type="text" value="zh-Hans" required maxlength="63" list="targets" spellcheck="false" aria-describedby="target-help" disabled>
      <datalist id="targets">
        <option value="zh-Hans" label="简体中文"></option>
        <option value="zh-Hant" label="繁体中文"></option>
        <option value="en" label="英语"></option>
        <option value="ja" label="日语"></option>
        <option value="ko" label="韩语"></option>
        <option value="fr" label="法语"></option>
        <option value="de" label="德语"></option>
        <option value="es" label="西班牙语"></option>
      </datalist>
      <small id="target-help" class="muted">从列表选择，或输入语言代码，如 en-US。</small>
    </div>
    <label for="ocrLanguage">识别语言</label>
    <select id="ocrLanguage"><option value="auto">自动检测</option></select>
    <small id="recognition-status" class="muted"></small>

    <div class="actions">
      <button id="save" class="primary" type="submit" disabled>保存设置</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
  <section id="translation-key" class="surface form" aria-labelledby="deepseek-heading" hidden>
    <h2 id="deepseek-heading">DeepSeek</h2>
    <p class="muted">翻译时会将当前图片中识别出的文字发送给 DeepSeek。</p>
    <label for="api-key">API 密钥</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" aria-describedby="key-help">
    <small id="key-help" class="muted">密钥保存在本机。</small>
    <div class="actions">
      <button id="save-key" class="primary" type="button" disabled>保存密钥</button>
      <p id="key-status" role="status" aria-live="polite">正在检查密钥状态…</p>
    </div>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
