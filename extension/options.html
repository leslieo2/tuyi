<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="optionsTitle">图译设置</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <header class="top">
    <h1 data-i18n="optionsTitle">图译设置</h1>
  </header>
  <form id="settings-form" class="surface form">
    <label for="mode" data-i18n="labelMode">处理方式</label>
    <select id="mode">
      <option value="translate" data-i18n="modeTranslate">识别并翻译</option>
      <option value="ocr" data-i18n="modeOcr">仅识别</option>
    </select>
    <div id="target-fields" class="form" hidden>
      <label for="target" data-i18n="labelTarget">目标语言</label>
      <input id="target" type="text" value="zh-Hans" required maxlength="63" list="targets" spellcheck="false" aria-describedby="target-help" disabled>
      <datalist id="targets">
        <option value="zh-Hans" data-i18n-label="langZhHans" label="简体中文"></option>
        <option value="zh-Hant" data-i18n-label="langZhHant" label="繁体中文"></option>
        <option value="en" data-i18n-label="langEn" label="英语"></option>
        <option value="ja" data-i18n-label="langJa" label="日语"></option>
        <option value="ko" data-i18n-label="langKo" label="韩语"></option>
        <option value="fr" data-i18n-label="langFr" label="法语"></option>
        <option value="de" data-i18n-label="langDe" label="德语"></option>
        <option value="es" data-i18n-label="langEs" label="西班牙语"></option>
      </datalist>
      <small id="target-help" class="muted" data-i18n="targetHelp">从列表选择，或输入语言代码，如 en-US。</small>
      <label for="api-base-url" data-i18n="labelApiBaseUrl">API 地址（OpenAI 兼容）</label>
      <input id="api-base-url" type="url" value="https://api.deepseek.com" required maxlength="512" list="api-base-urls" spellcheck="false" aria-describedby="api-base-url-help" disabled>
      <datalist id="api-base-urls">
        <option value="https://api.deepseek.com" label="DeepSeek"></option>
        <option value="https://api.openai.com/v1" label="OpenAI"></option>
        <option value="https://openrouter.ai/api/v1" label="OpenRouter"></option>
        <option value="http://127.0.0.1:11434/v1" label="Ollama (local)"></option>
        <option value="http://127.0.0.1:1234/v1" label="LM Studio (local)"></option>
      </datalist>
      <small id="api-base-url-help" class="muted" data-i18n="apiBaseUrlHelp">支持 DeepSeek、OpenAI、OpenRouter 或本机 Ollama / LM Studio 等兼容接口。</small>
      <label for="model" data-i18n="labelModel">模型名称</label>
      <input id="model" type="text" value="deepseek-flash" required maxlength="128" list="models" spellcheck="false" disabled>
      <datalist id="models">
        <option value="deepseek-flash" label="DeepSeek Flash"></option>
        <option value="deepseek-chat" label="DeepSeek Chat"></option>
        <option value="gpt-4o-mini" label="OpenAI GPT-4o mini"></option>
        <option value="gpt-4.1-mini" label="OpenAI GPT-4.1 mini"></option>
        <option value="qwen2.5:7b" label="Ollama Qwen 2.5 7B"></option>
      </datalist>
    </div>
    <label for="ocrLanguage" data-i18n="labelOcrLanguage">识别语言</label>
    <select id="ocrLanguage"><option value="auto" data-i18n="ocrAuto">自动检测</option></select>
    <small id="recognition-status" class="muted"></small>
    <label for="ui-language" data-i18n="labelUiLanguage">界面语言</label>
    <select id="ui-language">
      <option value="auto" data-i18n="uiLangAuto">跟随浏览器</option>
      <option value="zh_CN" data-i18n="uiLangZh">简体中文</option>
      <option value="en" data-i18n="uiLangEn">English</option>
    </select>

    <div class="actions">
      <button id="save" class="primary" type="submit" data-i18n="btnSaveSettings" disabled>保存设置</button>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </form>
  <section id="translation-key" class="surface form" aria-labelledby="api-heading" hidden>
    <h2 id="api-heading" data-i18n="apiHeading">翻译服务（OpenAI 兼容）</h2>
    <p class="muted" data-i18n="apiDescription">翻译时会将当前图片中识别出的文字发送给所配置的 OpenAI 兼容接口。</p>
    <label for="api-key" data-i18n="labelApiKey">API 密钥</label>
    <input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" aria-describedby="key-help">
    <small id="key-help" class="muted" data-i18n="keyHelp">密钥保存在 macOS 钥匙串；本机 Ollama 等无需认证的服务可留空。</small>
    <div class="actions">
      <button id="save-key" class="primary" type="button" data-i18n="btnSaveKey" disabled>保存密钥</button>
      <p id="key-status" role="status" aria-live="polite" data-i18n="keyStatusChecking">正在检查密钥状态…</p>
    </div>
  </section>
  <script type="module" src="options.js"></script>
</body>
</html>
