name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run test:native
      - run: bash scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: .build/image-translator-*-macos.zip
